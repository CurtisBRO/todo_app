version: '3.8'
services:
  web:
    build: .
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=172.16.8.3
      - DB_PORT=5432
      - DB_NAME=todolist
      - DB_USER=admin_user
      - DB_PASS=${DB_PASSWORD}
      - SCALEWAY_API_KEY=${SCW_API_KEY}
    restart: unless-stopped
